# One image, one container: Ubuntu 22.04, ROS 2 Humble and Isaac Sim 6.1 at
# /isaac-sim, with RViz, Nav2, the TurtleBot3 packages and this package.
#
#   ./docker/x11-auth.sh                          # once per X session
#   scripts/build_images.sh                       # base image, then this one
#   docker compose up -d
#   docker compose exec turtlebot3_isaacsim bash
#
# `exec` does not run the entrypoint, so anything scripted goes through it:
#
#   docker compose exec turtlebot3_isaacsim /entrypoint.sh bash -c 'ros2 topic list'

services:

  turtlebot3_isaacsim:
    build:
      context: ./docker/ros
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${TB3_BASE_IMAGE:-isaacsim61-humble:ngc}
    image: turtlebot3_isaacsim:humble
    container_name: turtlebot3_isaacsim
    network_mode: host
    privileged: true                      # /dev/ttyACM0 + lidar USB for the real robot

    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - PRIVACY_USERID=${PRIVACY_EMAIL:-user@example.com}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-30}
      - TURTLEBOT3_MODEL=${TURTLEBOT3_MODEL:-burger}
      - LDS_MODEL=${LDS_MODEL:-LDS-02}
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/root/.Xauthority

    volumes:
      - /dev:/dev
      - /run/udev:/run/udev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${TB3_XAUTH:-/tmp/turtlebot3_isaacsim.docker.xauth}:/root/.Xauthority:ro

      # This package, edited on the host and colcon-built inside.
      - .:/ws/src/turtlebot3_isaacsim

      # isaacsim_bringup, out of the IsaacSim-ros_workspaces clone beside this
      # package -- see README.md, "Install". create_host_path off so a missing
      # clone fails `up` instead of becoming an empty root-owned directory.
      - type: bind
        source: ../IsaacSim-ros_workspaces/humble_ws/src/isaacsim_bringup
        target: /ws/src/isaacsim_bringup
        bind:
          create_host_path: false

      # Kit caches: /scan appears ~165 s after a cold launch and ~14 s warm.
      - isaac_kit_cache:/isaac-sim/kit/cache
      - isaac_compute_cache:/root/.nv/ComputeCache
      - isaac_optix_cache:/var/tmp
      - isaac_kit_logs:/isaac-sim/kit/logs

      - ros_logs:/root/.ros

    working_dir: /ws
    command: sleep infinity
    init: true
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

volumes:
  ros_logs:
  isaac_kit_cache:
  isaac_compute_cache:
  isaac_optix_cache:
  isaac_kit_logs:
